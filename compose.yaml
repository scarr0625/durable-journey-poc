services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: durable_journey
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
    ports:
      - "5432:5432"
    volumes:
      - journey-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d durable_journey"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  journey-postgres-data:
