[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-journey-poc"
version = "0.1.0"
description = "Durable Cloud Journey state machine PoC using Google ADK and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.0,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
